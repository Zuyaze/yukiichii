<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#020617"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="500" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1000" cy="150" rx="400" ry="250" fill="url(#glow2)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#3b82f6" stroke-width="0.5" opacity="0.08"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#3b82f6" stroke-width="0.5" opacity="0.05"/>
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.1"/>

  <!-- Top badge -->
  <rect x="480" y="90" width="240" height="36" rx="18" fill="#3b82f6" opacity="0.15"/>
  <text x="600" y="114" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#60a5fa" text-anchor="middle" letter-spacing="3">MOD APK &amp; LOADER</text>

  <!-- Main title -->
  <text x="600" y="260" font-family="Arial,sans-serif" font-size="96" font-weight="900" text-anchor="middle" filter="url(#shadow)">
    <tspan fill="#3b82f6">Yukii</tspan><tspan fill="#ffffff">Chii</tspan>
  </text>

  <!-- X separator -->
  <line x1="420" y1="310" x2="520" y2="310" stroke="#334155" stroke-width="2"/>
  <circle cx="600" cy="310" r="24" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="318" font-family="Arial,sans-serif" font-size="22" font-weight="300" fill="#10b981" text-anchor="middle">×</text>
  <line x1="680" y1="310" x2="780" y2="310" stroke="#334155" stroke-width="2"/>

  <!-- Zuyaze -->
  <text x="600" y="395" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#10b981" text-anchor="middle" filter="url(#shadow)" letter-spacing="4">ZUYAZE</text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial,sans-serif" font-size="22" fill="#94a3b8" text-anchor="middle">
    Mod Apk &amp; Loader Gratis Terbaru
  </text>

  <!-- Bottom features -->
  <text x="380" y="555" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#22c55e" text-anchor="middle">✓ GRATIS</text>
  <text x="600" y="555" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#60a5fa" text-anchor="middle">✓ AMAN</text>
  <text x="820" y="555" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#a78bfa" text-anchor="middle">✓ UPDATE RUTIN</text>
</svg>